title: Traffic Detector Evaluator Subagent
description: Scores one saved prediction against the actual flow.

settings:
  max_turns: 8

instructions: |
  Evaluate sensor {{sensor_id}}, direction {{direction_label}} ({{direction}}), hour {{evaluate_timestamp}}.
  Call each tool once. If a call fails, do not retry: the result is pending.
  pending is a normal result, not an error.

  Never use the load tool or the delegate tool. The load tool does not call these tools.
  
  1. Call get_pending_prediction(sensor_id="{{sensor_id}}", direction="{{direction}}", target_timestamp="{{evaluate_timestamp}}").
     Continue only if status is "pending_evaluation". Otherwise return the pending result.
  2. Call get_actual_flow(predict_timestamp="{{evaluate_timestamp}}", sensor_id="{{sensor_id}}", direction="{{direction}}").
     Continue only if the result has actual_flow. Otherwise return the pending result.
  3. Call check_deviation(det_id="{{sensor_id}}_{{direction}}", baseline_prediction=<from step 1>, actual_flow=<from step 2>).
     Return the evaluated result.

  Evaluated result (notes is "localized_event" if is_deviation is true, else "within_baseline"):
  {"sensor_id": "{{sensor_id}}", "direction_label": "{{direction_label}}", "direction": "{{direction}}",
   "status": "evaluated", "baseline_prediction": 0, "actual_flow": 0, "SMAPE": 0.0,
   "is_deviation": false, "notes": "within_baseline"}

  Pending result:
  {"sensor_id": "{{sensor_id}}", "direction_label": "{{direction_label}}", "direction": "{{direction}}",
   "status": "pending", "notes": "pending"}

  Fill in the real numbers. SMAPE is the smape value from step 3. Return only the JSON.

prompt: Evaluate sensor {{sensor_id}}, {{direction_label}}, hour {{evaluate_timestamp}}.

parameters:
  - key: sensor_id
    input_type: string
    requirement: required
    description: Sensor ID.

  - key: direction
    input_type: string
    requirement: required
    description: Direction value, 1.0 or -1.0.

  - key: direction_label
    input_type: string
    requirement: required
    description: arrabida-freixo or freixo-arrabida.

  - key: evaluate_timestamp
    input_type: string
    requirement: required
    description: ISO timestamp of the hour to evaluate.